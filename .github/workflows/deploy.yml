name: Checklist Deploy
on:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_HOST: 'localhost'
      DB_NAME: 'release_checklist'
      DB_USER: 'sr_admin'
      DB_PASSWORD: '123@123sr'
      DB_PORT: '5432'
    services:
        postgres:
          image: postgres:latest
          env:
            POSTGRES_DB: 'release_checklist'
            POSTGRES_USER: 'sr_admin'
            POSTGRES_PASSWORD: '123@123sr'
          options: >- 
            --health-cmd "pg_isready -U sr_admin -d release_checklist"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5
    steps:
      - name: clone repo
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      
      - name: install requirements
        run: |
          cd ./backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          echo "Waiting for PostgreSQL to start..."
          until pg_isready -h localhost -p 5432 -U sr_admin; do
            sleep 1
          done
          python -m app.db.db_tabels
          pip install flake8 pytest

      - name: test the backend
        working-directory: ./backend
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics #syntax, invalid comparision, control flow errors & undefined variables'
          pytest
          
      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: install dependencies
        run: |
          cd ./frontend
          npm ci
          npm run lint
          npm run build
      
      - name: Validate docker config and create docker images
        run: |
          docker compose config -q
          docker compose build


  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # pre defined by github which clone the repo in the ubuntu temporary VM

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7 # help to copy the repo in VPS securly
        with:
          host: ${{secrets.VPS_HOST}}
          username: ${{secrets.VPS_USER}}
          key: ${{secrets.VPS_SSH_KEY}}
          source: "."
          target: "/home/shubham/checklist_tool"
        
      - name: Deploy with docker compose
        uses: appleboy/ssh-action@v1.0.3 # this action will securly open VPS terminal and ready to execute the commands in it
        with:
          host: ${{secrets.VPS_HOST}}
          username: ${{secrets.VPS_USER}}
          key: ${{secrets.VPS_SSH_KEY}}
          script: |
            cd /home/shubham/checklist_tool
            docker compose down
            docker compose up -d --build